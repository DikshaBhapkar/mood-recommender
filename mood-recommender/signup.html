<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Mood Recommender</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container card">
        <h1>Create Account ✨</h1>
        <p>Join us to track your moods and get recommendations</p>
        
        <div id="auth-error-msg" class="error-msg" style="display: none;"></div>

        <form id="signup-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Minimum 6 characters" minlength="6">
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        
        <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
