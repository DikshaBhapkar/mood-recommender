<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mood Recommender</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container card">
        <h1>Welcome Back 👋</h1>
        <p>Login to see your personalized recommendations</p>
        
        <div id="auth-error-msg" class="error-msg" style="display: none;"></div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>
        
        <p class="auth-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <!-- Ensure module type for Firebase v10 -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
